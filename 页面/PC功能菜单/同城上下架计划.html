<section class="city-shelf-plan-page" id="cityShelfPlanPage" hidden aria-label="同城上下架计划">
          <div class="city-shelf-plan-tabs" role="tablist" aria-label="上下架计划">
            <button class="active" id="cityShelfPlanTab" type="button" role="tab" aria-selected="true" aria-controls="cityShelfPlanPanel">商品上架计划</button>
            <button id="storeShelfPlanTab" type="button" role="tab" aria-selected="false" aria-controls="storeShelfPlanPanel" tabindex="-1">门店商品上架计划</button>
          </div>

          <div id="cityShelfPlanPanel" role="tabpanel" aria-labelledby="cityShelfPlanTab">
            <form class="city-shelf-plan-form" id="cityShelfPlanForm">
              <div class="city-shelf-plan-field">
                <span id="cityShelfPlanBusinessLabel">业态：</span>
                <div class="city-shelf-plan-business-options" id="cityShelfPlanBusiness" role="radiogroup" aria-labelledby="cityShelfPlanBusinessLabel"></div>
              </div>
              <div class="city-shelf-plan-task-row">
                <label class="city-shelf-plan-field" for="cityShelfPlanEnabled">
                  <span>开启上架任务：</span>
                  <span class="city-shelf-plan-switch-control"><input class="city-shelf-plan-switch" id="cityShelfPlanEnabled" name="enabled" type="checkbox" role="switch" aria-controls="cityShelfPlanTimeField" /></span>
                </label>
              </div>
              <label class="city-shelf-plan-field" id="cityShelfPlanTimeField" for="cityShelfPlanTime" hidden>
                <span>商品上架时间：</span>
                <input id="cityShelfPlanTime" name="shelfTime" type="time" step="60" disabled />
              </label>
              <div class="city-shelf-plan-actions">
                <button class="btn primary" type="submit">提交</button>
              </div>
            </form>
            <section class="city-shelf-pending" aria-labelledby="cityShelfPendingTitle">
              <h2 id="cityShelfPendingTitle">待上架的商品列表</h2>
              <form class="city-shelf-pending-filters" id="cityShelfPendingFilters">
                <label for="cityShelfPendingCode">商品编码：</label>
                <input id="cityShelfPendingCode" name="productCode" placeholder="请输入商品编码" />
                <button class="btn primary" type="submit">查询</button>
                <button class="btn" type="reset">重置</button>
              </form>
              <div class="city-shelf-pending-scroll" role="region" aria-label="待上架的商品列表" tabindex="0">
                <table class="city-shelf-pending-table">
                  <thead><tr><th scope="col">商品编码</th><th scope="col">商品名称</th><th scope="col">门店编码</th><th scope="col">门店名称</th><th scope="col">创建时间</th><th scope="col">更新时间</th></tr></thead>
                  <tbody id="cityShelfPendingBody"></tbody>
                </table>
                <div class="city-shelf-pending-empty" id="cityShelfPendingEmpty" hidden>暂无符合条件的待上架商品</div>
              </div>
              <div class="pagination-bar city-shelf-pending-pagination">
                <span class="pagination-total" id="cityShelfPendingTotal" aria-live="polite"></span>
                <label>每页 <select id="cityShelfPendingSize" aria-label="每页条数"><option value="5">5 条</option><option value="10">10 条</option></select></label>
                <div class="pagination" id="cityShelfPendingPagination" aria-label="待上架商品分页"></div>
                <label class="page-jump">前往 <input id="cityShelfPendingJump" type="number" min="1" value="1" aria-label="待上架商品页码" /> 页</label>
              </div>
            </section>
          </div>

          <!-- include: 页面/PC功能菜单/门店商品上架计划.html -->
        </section>
