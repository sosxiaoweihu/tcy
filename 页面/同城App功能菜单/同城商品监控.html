<section id="productMonitorPage" class="product-monitor-page" aria-label="同城商品监控" hidden>
  <header class="cp-top pm-header">
    <div class="cp-status pm-status" aria-hidden="true">
      <span>9:41</span>
      <svg viewBox="0 0 82 16" fill="currentColor">
        <rect x="2" y="10" width="3" height="4" rx="1"/><rect x="7" y="8" width="3" height="6" rx="1"/><rect x="12" y="5" width="3" height="9" rx="1"/><rect x="17" y="2" width="3" height="12" rx="1"/>
        <path d="M26 6a11 11 0 0 1 16 0l-1.8 1.8a8.5 8.5 0 0 0-12.4 0zM29 9a7 7 0 0 1 10 0l-1.7 1.7a4.5 4.5 0 0 0-6.6 0zM32 12a2.9 2.9 0 0 1 4 0l-2 2z"/>
        <rect x="50" y="2" width="25" height="12" rx="3" fill="none" stroke="currentColor" opacity=".65"/><rect x="52" y="4" width="21" height="8" rx="1.5"/><rect x="77" y="5" width="2" height="6" rx="1"/>
      </svg>
    </div>
    <div class="cp-title pm-heading">
      <button type="button" data-pm-action="back" class="pm-back" aria-label="返回全部工具"></button>
      <div><h1>每日Top销售监控</h1><p>同城云</p></div>
      <button type="button" data-pm-action="help" class="pm-help" aria-label="监控说明"><span aria-hidden="true">?</span></button>
    </div>
  </header>

  <div class="pm-filters" aria-label="监控筛选">
    <div><span id="pmDateLabel">日期</span><button type="button" data-pm-filter="date" aria-labelledby="pmDateLabel pmDateValue"><span id="pmDateValue">2026-11-13</span><i aria-hidden="true"></i></button></div>
    <div><span id="pmStoreLabel">门店</span><button type="button" data-pm-filter="store" aria-labelledby="pmStoreLabel pmStoreValue"><span id="pmStoreValue">全部门店</span><i aria-hidden="true"></i></button></div>
    <div><span id="pmChannelLabel">渠道</span><button type="button" data-pm-filter="channel" aria-labelledby="pmChannelLabel pmChannelValue"><span id="pmChannelValue">全部渠道</span><i aria-hidden="true"></i></button></div>
    <div><span id="pmRankLabel">榜单</span><button type="button" data-pm-filter="rank" aria-labelledby="pmRankLabel pmRankValue"><span id="pmRankValue">Top200</span><i aria-hidden="true"></i></button></div>
  </div>

  <div class="pm-scroll">
    <div id="pmOverview" class="pm-overview">
      <section class="pm-card pm-summary" aria-labelledby="pmSummaryTitle">
        <header>
          <span class="pm-summary-icon" aria-hidden="true" data-pm-icon="chart"></span>
          <div><h2 id="pmSummaryTitle">销售Top200监控（9点）</h2><p>抓取时间：<time id="pmCaptureTime">2026-11-13 09:00</time></p></div>
        </header>
        <div class="pm-metrics">
          <div><i data-pm-icon="tag" aria-hidden="true"></i><span>监控SKU数<strong id="pmSkuCount">200</strong></span></div>
          <div><i data-pm-icon="bag" aria-hidden="true"></i><span>在售SKU数<strong id="pmAvailableCount">181</strong></span></div>
          <div><i data-pm-icon="pulse" aria-hidden="true"></i><span>出勤率<strong id="pmAttendance" class="pm-emphasis">90.5%</strong></span></div>
          <div><i data-pm-icon="coins" aria-hidden="true"></i><span>销售金额<strong id="pmSales" class="pm-emphasis">¥2,000.00</strong></span></div>
          <div><i data-pm-icon="order" aria-hidden="true"></i><span>订单数<strong id="pmOrders">35单</strong></span></div>
          <button type="button" data-pm-action="details"><i data-pm-icon="box" aria-hidden="true"></i><span>下架明细<strong id="pmOffShelfCount" class="pm-emphasis">19条</strong></span><b class="pm-chevron" aria-hidden="true"></b></button>
        </div>
      </section>

      <section class="pm-card pm-changes" aria-labelledby="pmChangesTitle">
        <h2 id="pmChangesTitle" class="pm-section-title">状态变化</h2>
        <div class="pm-change-grid">
          <button type="button" data-pm-status="new"><i aria-hidden="true">−</i><span>新下架<strong id="pmNewCount">1<small>个</small></strong></span></button>
          <button type="button" data-pm-status="restored"><i aria-hidden="true">✓</i><span>恢复上架<strong id="pmRestoredCount">2<small>个</small></strong></span></button>
          <button type="button" data-pm-status="off"><i aria-hidden="true">!</i><span>持续下架<strong id="pmOngoingCount">18<small>个</small></strong></span></button>
        </div>
      </section>

      <section class="pm-card pm-details" aria-labelledby="pmDetailsTitle">
        <div class="pm-details-heading">
          <h2 id="pmDetailsTitle" class="pm-section-title">下架明细</h2>
          <button type="button" class="pm-download" data-pm-action="download">下载商品明细</button>
        </div>
        <div id="pmRows" class="pm-rows"></div>
        <button type="button" class="pm-all" data-pm-action="details">查看全部明细 <b class="pm-chevron" aria-hidden="true"></b></button>
      </section>
    </div>

    <section id="pmAllDetails" class="pm-card pm-details pm-full-details" aria-labelledby="pmAllTitle" hidden>
      <div class="pm-details-heading">
        <h2 class="pm-section-title" id="pmAllTitle">下架明细</h2>
        <button type="button" class="pm-download" data-pm-action="download">下载商品明细</button>
      </div>
      <div id="pmAllRows" class="pm-rows"></div>
      <p id="pmSampleCount" class="pm-sample-count"></p>
    </section>
  </div>

  <div id="pmOverlay" class="pm-overlay" hidden>
    <button type="button" class="pm-backdrop" data-pm-action="dismiss" tabindex="-1" aria-label="关闭弹层"></button>
    <section class="pm-sheet" role="dialog" aria-modal="true" aria-labelledby="pmSheetTitle">
      <header><h2 id="pmSheetTitle"></h2><button type="button" data-pm-action="dismiss" aria-label="关闭弹层">×</button></header>
      <div id="pmSheetBody" class="pm-sheet-body"></div>
    </section>
  </div>
</section>
